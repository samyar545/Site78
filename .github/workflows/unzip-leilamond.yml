name: Unzip leilamond-phase4.zip
on:
  workflow_dispatch: {}

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract zip and commit
        run: |
          if [ -f "leilamond-phase4.zip" ]; then
            unzip -o leilamond-phase4.zip -d .
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add leilamond || true
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Extract leilamond-phase4.zip"
              git push
            fi
          else
            echo "leilamond-phase4.zip not found in repo root"
            exit 1
          fi
