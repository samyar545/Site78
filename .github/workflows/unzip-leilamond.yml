name: Unzip leilamond-phase4.zip
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract zip and push to branch
        env:
          BRANCH: unzip/leilamond-phase4-${{ github.run_id }}
        run: |
          if [ ! -f "leilamond-phase4.zip" ]; then
            echo "leilamond-phase4.zip not found in repo root"
            exit 1
          fi
          unzip -o leilamond-phase4.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add leilamond || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract leilamond-phase4.zip"
            git push --set-upstream origin "$BRANCH"
            echo "Pushed to branch: $BRANCH"
          fi
