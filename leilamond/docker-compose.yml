version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leilamond
      POSTGRES_PASSWORD: leilamond
      POSTGRES_DB: leilamond
    ports:
      - "5432:5432"
    volumes:
      - leilamond_db_data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  leilamond_db_data:
